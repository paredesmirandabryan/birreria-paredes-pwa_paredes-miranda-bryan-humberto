<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Catálogo (SSR) — Birriería Paredes</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #fff7ed; color: #292524; margin: 2rem; }
    h1 { color: #9a3412; }
    .catalogo { list-style: none; padding: 0; max-width: 720px; }
    .catalogo li { display: flex; gap: 1rem; align-items: baseline; background: white; border: 1px solid #fed7aa; border-radius: 8px; padding: .6rem .9rem; margin-bottom: .5rem; }
    .catalogo strong { flex: 1; }
    .categoria, .stock { color: #78716c; font-size: .9rem; }
    .precio { color: #9a3412; font-weight: 700; }
  </style>
</head>
<body>
  <h1>Birriería Paredes · Catálogo</h1>
  <p>Versión renderizada en el servidor (SSR) con Django.</p>

  <!-- Cada producto llega ya escrito en el HTML: nombre, precio y stock -->
  <ul class="catalogo">
    {% for producto in productos %}
    <li><strong>{{ producto.nombre }}</strong> <span class="categoria">{{ producto.categoria }}</span> <span class="precio">${{ producto.precio }}</span> <span class="stock">Stock: {{ producto.stock }}</span></li>
    {% endfor %}
  </ul>
</body>
</html>
