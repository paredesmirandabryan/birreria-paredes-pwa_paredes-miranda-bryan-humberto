<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Catálogo (SSR) — Birriería Paredes</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #fff7ed; color: #292524; margin: 2rem; }
    h1 { color: #9a3412; }
    table { border-collapse: collapse; width: 100%; max-width: 720px; background: white; }
    th, td { border: 1px solid #fed7aa; padding: .5rem .75rem; text-align: left; }
    th { background: #9a3412; color: white; }
  </style>
</head>
<body>
  <h1>Birriería Paredes · Catálogo</h1>
  <p>Versión renderizada en el servidor (SSR) con Django.</p>

  <table>
    <tr><th>Producto</th><th>Categoría</th><th>Precio</th></tr>
    {% for producto in productos %}
      <tr>
        <td>{{ producto.nombre }}</td>
        <td>{{ producto.categoria }}</td>
        <td>${{ producto.precio }}</td>
      </tr>
    {% endfor %}
  </table>
</body>
</html>
