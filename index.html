<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Birriería Paredes</title>
  <meta name="description" content="Birriería Paredes: catálogo de birria, tacos, bebidas y más.">
  <meta name="theme-color" content="#9a3412">

  <!-- Estas líneas se activan en el avance 3, cuando existan los archivos -->
  <link rel="manifest" href="manifest.json"> 
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml"> 

  <link rel="stylesheet" href="css/estilos.css">

  <!-- <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"> -->
</head>
<body>

  <!-- ============ APP SHELL ============ -->

  <header class="appbar">
    <img src="img/logo.png" alt="Logo de Birriería Paredes" class="logo">
    <h1>Birriería Paredes</h1>
  </header>

  <main>
    <section>
      <h2>Catálogo</h2>
      <!-- Este div empieza vacío: csr.js lo llena con las 15 tarjetas -->
      <div id="catalogo" class="grid" aria-busy="true"></div>
    </section>
    
        <section>
      <h2>Carrito</h2>
      <ul id="carrito-lista"></ul>
      <p class="carrito-total">Total: $<span id="carrito-total">0</span></p>
      <button id="btn-sincronizar" type="button">Sincronizar carrito</button>
      <p id="carrito-mensaje" class="mensaje"></p>
    </section>

        <section>
      <h2>Notificaciones</h2>
      <button id="btn-notificar" type="button">Activar notificaciones</button>
      <p id="notificaciones-mensaje" class="mensaje"></p>
    </section>

        <section>
      <h2>Distancia a la sucursal</h2>
      <p class="sucursal-info">Sucursal: <strong>Birriería Paredes</strong>, Hermosillo, Sonora.</p>
      <button id="btn-ubicacion" type="button">Usar mi ubicación</button>
      <p id="ubicacion-mensaje" class="mensaje"></p>
      <div id="mapa-ruta" class="mapa" hidden></div>
    </section>

  </main>

  <footer>
    <p>Birriería Paredes · PAREDES MIRANDA BRYAN HUMBERTO</p>
  </footer>

  <script src="js/carrito.js"></script>
  <script src="js/csr.js"></script>
  <script src="js/notificaciones.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="js/geolocalizacion.js"></script>
  <!-- <script src="js/app.js"></script> -->

    }
  </script>
  -->
</body>
</html>
